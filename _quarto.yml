project:
  type: website
  render:
    - "*.qmd"
    - "!rv/**/*.qmd"

website:
  title: "Données émergentes"
  sidebar:
    style: "docked"
    search: true
    contents:
      - text: "Accueil"
        file: index.qmd
      - section: "Introduction"
        contents:
          - introduction.qmd
      - section: "Données administratives"
        contents:
          - administratives.qmd
          - administratives_exemples.qmd
      - section: "Données géolocalisées"
        contents:
          - geolocalized_data.qmd
          - applications/spatial/application1.qmd
          - applications/spatial/geolocalized_data_bonus.qmd
      - section: "Analyse textuelle"
        contents:
          - textes.qmd
          - applications/ape/ape.qmd
          - applications/nlp/textes_bonus.qmd
      - section: "Analyse d'images"
        contents:
          - images.qmd
          - applications/images/images_bonus.qmd
      - section: "Nowcasting"
        contents:
          - nowcasting.qmd
          - applications/nowcasting/nowcasting_bonus.qmd
    tools:
      - icon: twitter
        href: https://twitter.com
      - icon: github
        menu:
          - text: Source Code
            url: https://github.com/InseeFrLab/cours-nouvelles-donnees-site
          - text: Report a Bug
            url: https://github.com/InseeFrLab/cours-nouvelles-donnees-site/issues
  page-navigation: true
  page-footer:
    left: "(c) 2026, Galiana.L, Seimandi.T, Pramil.J, Toulemonde.N"
    right:
      - icon: github
        href: https://github.com/InseeFrLab/cours-nouvelles-donnees-site
  reader-mode: true
  repo-url: https://github.com/InseeFrLab/cours-nouvelles-donnees-site
  repo-actions: [edit, issue]
  twitter-card:
    creator: "@linogaliana"
  open-graph: true

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true

theme:
  light: [flatly, custom.scss]
  dark: [darkly, custom.scss]

filters:
  #- black-formatter
  - build/callout-vscode.lua
  #- include-code-files
